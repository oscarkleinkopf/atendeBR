ndefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$L5\",null,{\"lessons\":[{\"id\":\"c0000001-0000-0000-0000-000000000001\",\"path_id\":\"a0000001-0000-0000-0000-000000000001\",\"slug\":\"boas-vindas\",\"title\":\"Boas-vindas que abren puertas\",\"summary\":\"Saludos cálidos vs formales: cuándo usar cada uno.\",\"content_md\":\"# Boas-vindas que abren puertas\\n\\nEn Brasil, el saludo no es un trámite: es la primera señal de que hay una persona detrás del ticket.\\n\\n## Lo que funciona\\n- **\\\"Oi, tudo bem?\\\"** — cercano, ideal en chat/WhatsApp.\\n- **\\\"Olá! Como posso te ajudar hoje?\\\"** — profesional y cálido.\\n- Usar el nombre del cliente temprano: *\\\"Oi, Mariana!\\\"*\\n\\n## Evita\\n- Traducir literal desde el español.\\n- Empezar directo al problema sin connection.\\n\\n## Tip cultural\\nLos brasileños esperan calor humano incluso en reclamos. Un saludo breve + empatía reduce escalamientos.\",\"audio_script\":\"Oi, tudo bem? Meu nome é Camila e vou te ajudar hoje. Pode me contar o que aconteceu?\",\"lesson_type\":\"content\",\"duration_minutes\":6,\"sort_order\":1,\"phrases_json\":[{\"pt\":\"Oi, tudo bem?\",\"es\":\"Hola, ¿todo bien?\",\"note\":\"Saludo cotidiano cálido\"},{\"pt\":\"Como posso te ajudar hoje?\",\"es\":\"¿Cómo te puedo ayudar hoy?\",\"note\":\"Apertura profesional\"}]},{\"id\":\"c0000001-0000-0000-0000-000000000002\",\"path_id\":\"a0000001-0000-0000-0000-000000000001\",\"slug\":\"tom-e-calor\",\"title\":\"Tono y calor: el jeitinho de atender\",\"summary\":\"Cómo sonar cercano sin perder profesionalismo.\",\"content_md\":\"# Tono y calor\\n\\nEl portugués \\\"correcto pero frío\\\" es el error más común de equipos chilenos.\\n\\n## Señales de calidez\\n- Diminutivos naturales: *momentinho*.\\n- Confirmaciones: *certo*, *entendi*, *pode deixar*.\\n- Cierre positivo: *qualquer coisa, estou por aqui*.\\n\\n## Práctica\\nEn vez de: \\\"Vou verificar e retorno.\\\"\\nPrueba: \\\"Deixa eu verificar isso rapidinho e já te retorno, combinado?\\\"\",\"audio_script\":\"Deixa eu verificar isso rapidinho e já te retorno, combinado?\",\"lesson_type\":\"culture\",\"duration_minutes\":7,\"sort_order\":2,\"phrases_json\":[{\"pt\":\"Deixa eu verificar isso rapidinho\",\"es\":\"Déjame revisar eso rapidito\",\"note\":\"Calidez + acción\"},{\"pt\":\"Pode deixar comigo\",\"es\":\"Déjamelo a mí\",\"note\":\"Ownership\"}]},{\"id\":\"c0000001-0000-0000-0000-000000000003\",\"path_id\":\"a0000001-0000-0000-0000-000000000001\",\"slug\":\"empatia-em-reclamacoes\",\"title\":\"Empatía en reclamos\",\"summary\":\"Validar frustración antes de ofrecer solución.\",\"content_md\":\"# Empatía en reclamos\\n\\nValida el sentimiento **antes** de la solución.\\n\\n## Fórmula ACE\\n1. **Acknowledge** — *Entendo sua frustração...*\\n2. **Care** — *Sinto muito pelo transtorno.*\\n3. **Engage** — *Vamos resolver isso juntos.*\\n\\n## Evita\\n- Justificar la empresa antes de escuchar.\\n- Respuestas robot al inicio.\",\"audio_script\":\"Sinto muito pelo transtorno. Vamos resolver isso juntos agora.\",\"lesson_type\":\"content\",\"duration_minutes\":8,\"sort_order\":3,\"phrases_json\":[{\"pt\":\"Sinto muito pelo transtorno\",\"es\":\"Lamento el inconveniente\",\"note\":\"Empatía\"},{\"pt\":\"Vamos resolver isso juntos\",\"es\":\"Vamos a resolver esto juntos\",\"note\":\"Alianza\"}]},{\"id\":\"c0000001-0000-0000-0000-000000000004\",\"path_id\":\"a0000001-0000-0000-0000-000000000001\",\"slug\":\"humor-leve\",\"title\":\"Humor leve (sin forzar)\",\"summary\":\"Cuándo un toque de humor desarma tensión.\",\"content_md\":\"# Humor leve\\n\\nEl humor brasileño en atención es ligereza, no stand-up.\\n\\n## Seguro\\n- Autoironía suave sobre demoras ya resueltas.\\n- Emojis moderados en chat (1–2).\\n\\n## Peligroso\\n- Bromear sobre el dinero perdido del cliente.\\n- Ironía seca que puede leerse como soberbia.\",\"audio_script\":\"Poxa, três vezes é demais mesmo. Vamos fazer dessa a última, combinado?\",\"lesson_type\":\"culture\",\"duration_minutes\":6,\"sort_order\":4,\"phrases_json\":[{\"pt\":\"Poxa, que chato isso\",\"es\":\"Pucha, qué lata\",\"note\":\"Validación coloquial\"},{\"pt\":\"Combinado?\",\"es\":\"¿Trato?\",\"note\":\"Cierre colaborativo\"}]},{\"id\":\"c0000001-0000-0000-0000-000000000005\",\"path_id\":\"a0000001-0000-0000-0000-000000000001\",\"slug\":\"voce-ou-o-senhor\",\"title\":\"Você, tu u o senhor?\",\"summary\":\"Niveles de formalidad según canal y edad.\",\"content_md\":\"# Você, tu u o senhor?\\n\\n## Regla práctica\\n- Chat / WhatsApp / menores de 40 → **você**\\n- Clientes mayores o B2B formal → **o senhor / a senhora**\\n- Evita *tu* fuera del sur de Brasil.\",\"audio_script\":\"Bom dia, senhora Ana. Como posso ajudá-la hoje?\",\"lesson_type\":\"content\",\"duration_minutes\":5,\"sort_order\":5,\"quiz_json\":{\"questions\":[{\"q\":\"En WhatsApp con un cliente de 28 años, ¿qué es más natural?\",\"options\":[\"O senhor precisa de ajuda?\",\"Você precisa de uma ajuda?\",\"Tu precisas de ajuda?\"],\"answer\":1}]},\"phrases_json\":[{\"pt\":\"Como posso ajudá-lo?\",\"es\":\"¿Cómo puedo ayudarlo?\",\"note\":\"Formal\"},{\"pt\":\"Posso te ajudar?\",\"es\":\"¿Puedo ayudarte?\",\"note\":\"Cercano\"}]},{\"id\":\"c0000001-0000-0000-0000-000000000006\",\"path_id\":\"a0000001-0000-0000-0000-000000000001\",\"slug\":\"frases-de-ouro\",\"title\":\"Frases de oro del soporte\",\"summary\":\"Biblioteca corta de frases de alto impacto.\",\"content_md\":\"# Frases de oro\\n\\nMemoriza estas 8 — cubren el 80% de los momentos críticos.\\n\\n1. *Pode me contar um pouco mais sobre o que aconteceu?*\\n2. *Entendi. Deixa eu repetir pra garantir que estamos alinhados...*\\n3. *Já localizei seu pedido.*\\n4. *Vou priorizar isso pra você.*\\n5. *O prazo é X; se mudar, te aviso.*\\n6. *Qualquer dúvida, me chama por aqui.*\\n7. *Obrigada pela paciência — de verdade.*\\n8. *Ficou alguma coisa pendente?*\",\"audio_script\":\"Já localizei seu pedido e vou priorizar isso pra você.\",\"lesson_type\":\"practice\",\"duration_minutes\":7,\"sort_order\":6,\"phrases_json\":[{\"pt\":\"Pode me contar um pouco mais?\",\"es\":\"¿Me cuentas un poco más?\",\"note\":\"Descubrimiento\"},{\"pt\":\"Já localizei seu pedido\",\"es\":\"Ya ubiqué tu pedido\",\"note\":\"Progreso\"},{\"pt\":\"Vou priorizar isso pra você\",\"es\":\"Voy a priorizar esto\",\"note\":\"Cuidado\"},{\"pt\":\"Ficou alguma coisa pendente?\",\"es\":\"¿Quedó algo pendiente?\",\"note\":\"Cierre\"}]},{\"id\":\"c0000001-0000-0000-0000-000000000007\",\"path_id\":\"a0000001-0000-0000-0000-000000000001\",\"slug\":\"cliente-conversador\",\"title\":\"El cliente muy conversador\",\"summary\":\"Mantener rapport sin perder el hilo del caso.\",\"content_md\":\"# Cliente conversador\\n\\n## Técnica sandwich\\n1. Reconoce el comentario humano (1 frase).\\n2. Vuelve al caso con puente suave.\\n3. Cierra con siguiente paso claro.\",\"audio_script\":\"Que legal! Sobre a entrega: já vi o que aconteceu e vou liberar o reenvio hoje.\",\"lesson_type\":\"culture\",\"duration_minutes\":6,\"sort_order\":7,\"phrases_json\":[{\"pt\":\"Que legal!\",\"es\":\"¡Qué bueno!\",\"note\":\"Validación\"},{\"pt\":\"Sobre a entrega...\",\"es\":\"Sobre la entrega...\",\"note\":\"Puente\"}]},{\"id\":\"c0000001-0000-0000-0000-000000000008\",\"path_id\":\"a0000001-0000-0000-0000-000000000001\",\"slug\":\"negociacao-suave\",\"title\":\"Negociación suave de expectativas\",\"summary\":\"Prometer menos, comunicar más — sin sonar burocrático.\",\"content_md\":\"# Negociación suave\\n\\nCuando no puedes dar lo que piden:\\n1. Empatiza.\\n2. Explica el límite en lenguaje humano.\\n3. Ofrece la mejor alternativa real.\\n4. Pregunta si les sirve.\",\"audio_script\":\"Infelizmente não consigo o reembolso integral hoje, mas posso oferecer um crédito de 100% + frete grátis. Faz sentido pra você?\",\"lesson_type\":\"content\",\"duration_minutes\":7,\"sort_order\":8,\"quiz_json\":{\"questions\":[{\"q\":\"Orden correcto al negar una solicitud\",\"options\":[\"Política → empatía → alternativa\",\"Empatía → límite → alternativa → confirmación\",\"Alternativa → silencio\"],\"answer\":1}]},\"phrases_json\":[{\"pt\":\"Infelizmente não consigo...\",\"es\":\"Lamentablemente no puedo...\",\"note\":\"Negación suave\"},{\"pt\":\"Faz sentido pra você?\",\"es\":\"¿Te hace sentido?\",\"note\":\"Co-creación\"}]},{\"id\":\"c0000001-0000-0000-0000-000000000009\",\"path_id\":\"a0000001-0000-0000-0000-000000000001\",\"slug\":\"false-friends\",\"title\":\"Falsos amigos ES→PT\",\"summary\":\"Palabras que parecen iguales y generan malentendidos.\",\"content_md\":\"# Falsos amigos\\n\\n| Español | Evita en PT | Usa |\\n| --- | --- | --- |\\n| Exquisito | *esquisito* (= raro) | *delicioso / ótimo* |\\n| Apellido | *apelido* (= apodo) | *sobrenome* |\\n| Rato | *rato* (= ratón) | *um instante* |\",\"audio_script\":\"Cuidado: esquisito em português significa estranho, não delicioso!\",\"lesson_type\":\"quiz\",\"duration_minutes\":5,\"sort_order\":9,\"quiz_json\":{\"questions\":[{\"q\":\"¿Cómo dices apellido en portugués?\",\"options\":[\"apelido\",\"sobrenome\",\"sobrenombre\"],\"answer\":1},{\"q\":\"esquisito significa...\",\"options\":[\"delicioso\",\"extraño/raro\",\"elegante\"],\"answer\":1}]},\"phrases_json\":[{\"pt\":\"sobrenome\",\"es\":\"apellido\",\"note\":\"No confundir con apelido\"},{\"pt\":\"um instante\",\"es\":\"un rato\",\"note\":\"No usar rato\"}]},{\"id\":\"c0000001-0000-0000-0000-00000000000a\",\"path_id\":\"a0000001-0000-0000-0000-000000000001\",\"slug\":\"fechamento\",\"title\":\"Cierre memorable\",\"summary\":\"Cómo terminar dejando buena sensación y puerta abierta.\",\"content_md\":\"# Cierre memorable\\n\\n1. Resume lo acordado.\\n2. Agradece con sinceridad.\\n3. Deja canal abierto sin sonar desesperado.\\n\\n\\\"Pronto! Reenvio liberado com tracking novo. Qualquer coisa, me chama por aqui. Foi um prazer te ajudar!\\\"\",\"audio_script\":\"Pronto! Foi um prazer te ajudar!\",\"lesson_type\":\"practice\",\"duration_minutes\":6,\"sort_order\":10,\"phrases_json\":[{\"pt\":\"Pronto!\",\"es\":\"¡Listo!\",\"note\":\"Cierre\"},{\"pt\":\"Foi um prazer te ajudar\",\"es\":\"Fue un placer ayudarte\",\"note\":\"Cálido\"},{\"pt\":\"Qualquer coisa, me chama\",\"es\":\"Cualquier cosa, escríbeme\",\"note\":\"Disponibilidad\"}]}],\"pathTitle\":\"Atención al Cliente\",\"pathDescription\":\"Portugués brasileño natural para equipos de soporte y atención. Microlearning + práctica cultural.\",\"estimatedHours\":5.5}],[\"$L6\"],\"$L7\"]}],{},null,false,null]},null,false,\"$8\"]},null,false,\"$8\"]},null,false,null]},null,false,null],\"$L9\",false]],\"m\":\"$undefined\",\"G\":[\"$a\",[\"$Lb\"]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"VCkFV2xFlkhfV7lTnST1m\"}\nc:I[97367,[\"/atendeBR/_next/static/chunks/0h2qsuyze9ds1.js\"],\"OutletBoundary\"]\nd:\"$Sreact.suspense\"\nf:I[97367,[\"/atendeBR/_next/static/chunks/0h2qsuyze9ds1.js\"],\"ViewportBoundary\"]\n11:I[97367,[\"/atendeBR/_next/static/chunks/0h2qsuyze9ds1.js\"],\"MetadataBoundary\"]\n6:[\"$\",\"script\",\"script-0\",{\"src\":\"/atendeBR/_next/static/chunks/2y3ugn-s3nm4w.js\",\"async\":true,\"nonce\":\"$undefined\"}]\n7:[\"$\",\"$Lc\",null,{\"children\":[\"$\",\"$d\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@e\"}]}]\n9:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lf\",null,{\"children\":\"$L10\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L11\",null,{\"ch
